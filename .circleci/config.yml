version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: pip install -r GitHubApi-hw03a/requirements.txt

      - run:
          name: Run Triangle tests
          command: python -m unittest -v test_triangle.py

      - run:
          name: Run GitHub API tests
          command: python -m unittest -v GitHubApi-hw03a/TestGithubApi.py

workflows:
  test-workflow:
    jobs:
      - test